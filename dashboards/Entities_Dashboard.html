<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Entities Dashboard</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#e3e6ea;--c1:#2563eb;--c2:#0d9488;--c3:#d97706;--c4:#7c3aed;--c5:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1a1e24;--tx:#e8eaed;--mu:#9aa3af;--bd:#2c323a;--c1:#60a5fa;--c2:#2dd4bf;--c3:#fbbf24;--c4:#a78bfa;--c5:#f87171}}
*{box-sizing:border-box}body{margin:0 auto;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;padding:20px;max-width:1100px}
h1{font-size:22px;margin:0}p.s{color:var(--mu);margin:2px 0 18px}
.g{display:grid;gap:12px}.k{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
.c .n{font-size:28px;font-weight:600}.c .l{color:var(--mu);font-size:13px}h2{font-size:15px;margin:0 0 12px}
.row{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px;cursor:pointer}.row .nm{width:150px;flex:none}.bar{flex:1;display:flex;height:18px;border-radius:4px;overflow:hidden;background:var(--bd)}.bar i{display:block}.row b{width:24px;text-align:right}
.lg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mu);margin-top:8px}.lg span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;background:var(--col)}
.f{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}input,select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;font:inherit}input{flex:1;min-width:150px}
.t{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:500}
.tag{padding:1px 8px;border-radius:99px;font-size:11px;background:var(--bd)}
</style></head><body>
<h1>Power-sector entities dashboard</h1><p class="s">dim_entities.csv · 47 entities across 5 regions</p>
<div class="g k" id="kpi"></div>
<div class="g two"><div class="c"><h2>Entities by region and type <span style="color:var(--mu);font-weight:400">(click a row to filter)</span></h2><div id="bars"></div><div class="lg" id="lg"></div></div>
<div class="c"><h2>States / UTs per region</h2><div id="st"></div></div></div>
<div class="c" style="margin-top:12px"><h2>Entity explorer</h2><div class="f"><input id="q" placeholder="Search entity…"><select id="r"></select><select id="t"></select></div><div class="t"><table><thead><tr><th>Entity</th><th>Type</th><th>Region</th><th>Flags</th></tr></thead><tbody id="tb"></tbody></table></div><p class="s" id="ct" style="margin:8px 0 0"></p></div>
<script>
const D=[["All India", "all_india", "All India", "ALL", 0, 0], ["Others (ER)", "others", "Eastern Region", "ER", 0, 1], ["Eastern Region", "region", "Eastern Region", "ER", 0, 0], ["Andaman & Nicobar", "state_ut", "Eastern Region", "ER", 1, 0], ["Bihar", "state_ut", "Eastern Region", "ER", 0, 0], ["Jharkhand", "state_ut", "Eastern Region", "ER", 0, 0], ["Odisha", "state_ut", "Eastern Region", "ER", 0, 0], ["Sikkim", "state_ut", "Eastern Region", "ER", 0, 0], ["West Bengal", "state_ut", "Eastern Region", "ER", 0, 0], ["DVC", "utility", "Eastern Region", "ER", 0, 0], ["Others (NER)", "others", "North-Eastern Region", "NER", 0, 1], ["North-Eastern Region", "region", "North-Eastern Region", "NER", 0, 0], ["Arunachal Pradesh", "state_ut", "North-Eastern Region", "NER", 0, 0], ["Assam", "state_ut", "North-Eastern Region", "NER", 0, 0], ["Manipur", "state_ut", "North-Eastern Region", "NER", 0, 0], ["Meghalaya", "state_ut", "North-Eastern Region", "NER", 0, 0], ["Mizoram", "state_ut", "North-Eastern Region", "NER", 0, 0], ["Nagaland", "state_ut", "North-Eastern Region", "NER", 0, 0], ["Tripura", "state_ut", "North-Eastern Region", "NER", 0, 0], ["Others (NR)", "others", "Northern Region", "NR", 0, 1], ["Northern Region", "region", "Northern Region", "NR", 0, 0], ["Chandigarh", "state_ut", "Northern Region", "NR", 0, 0], ["Delhi", "state_ut", "Northern Region", "NR", 0, 0], ["Haryana", "state_ut", "Northern Region", "NR", 0, 0], ["Himachal Pradesh", "state_ut", "Northern Region", "NR", 0, 0], ["J&K and Ladakh", "state_ut", "Northern Region", "NR", 0, 0], ["Punjab", "state_ut", "Northern Region", "NR", 0, 0], ["Rajasthan", "state_ut", "Northern Region", "NR", 0, 0], ["Uttar Pradesh", "state_ut", "Northern Region", "NR", 0, 0], ["Uttarakhand", "state_ut", "Northern Region", "NR", 0, 0], ["Others (SR)", "others", "Southern Region", "SR", 0, 1], ["Southern Region", "region", "Southern Region", "SR", 0, 0], ["Andhra Pradesh", "state_ut", "Southern Region", "SR", 0, 0], ["Karnataka", "state_ut", "Southern Region", "SR", 0, 0], ["Kerala", "state_ut", "Southern Region", "SR", 0, 0], ["Lakshadweep", "state_ut", "Southern Region", "SR", 1, 0], ["Puducherry", "state_ut", "Southern Region", "SR", 0, 0], ["Tamil Nadu", "state_ut", "Southern Region", "SR", 0, 0], ["Telangana", "state_ut", "Southern Region", "SR", 0, 0], ["Others (WR)", "others", "Western Region", "WR", 0, 1], ["Western Region", "region", "Western Region", "WR", 0, 0], ["Chhattisgarh", "state_ut", "Western Region", "WR", 0, 0], ["Dadra & Nagar Haveli and Daman & Diu", "state_ut", "Western Region", "WR", 0, 0], ["Goa", "state_ut", "Western Region", "WR", 0, 0], ["Gujarat", "state_ut", "Western Region", "WR", 0, 0], ["Madhya Pradesh", "state_ut", "Western Region", "WR", 0, 0], ["Maharashtra", "state_ut", "Western Region", "WR", 0, 0]];
const T={all_india:["All India","--c5"],region:["Region","--c1"],state_ut:["State / UT","--c2"],utility:["Utility","--c4"],others:["Others bucket","--c3"]};
const R=["NR","WR","SR","ER","NER"],RN={NR:"Northern",WR:"Western",SR:"Southern",ER:"Eastern",NER:"North-Eastern"};
const $=i=>document.getElementById(i),cv=v=>"var("+v+")";
const cnt=f=>D.filter(f).length;
$("kpi").innerHTML=[["Total entities",D.length],["States / UTs",cnt(d=>d[1]=="state_ut")],["Regions",cnt(d=>d[1]=="region")],["Utilities",cnt(d=>d[1]=="utility")],["Others buckets",cnt(d=>d[5])],["Standalone UTs",cnt(d=>d[4])]].map(a=>`<div class="c"><div class="n">${a[1]}</div><div class="l">${a[0]}</div></div>`).join("");
const types=["state_ut","utility","others","region"];
$("bars").innerHTML=R.map(r=>{const tot=cnt(d=>d[3]==r);return `<div class="row" onclick="pick('${r}')"><span class="nm">${RN[r]} (${r})</span><div class="bar">${types.map(t=>{const n=cnt(d=>d[3]==r&&d[1]==t);return n?`<i title="${T[t][0]}: ${n}" style="width:${n/12*100}%;background:${cv(T[t][1])}"></i>`:""}).join("")}</div><b>${tot}</b></div>`}).join("");
$("lg").innerHTML=types.map(t=>`<span style="--col:${cv(T[t][1])}">${T[t][0]}</span>`).join("");
const mx=Math.max(...R.map(r=>cnt(d=>d[3]==r&&d[1]=="state_ut")));
$("st").innerHTML=R.map(r=>{const n=cnt(d=>d[3]==r&&d[1]=="state_ut");return `<div class="row" onclick="pick('${r}')"><span class="nm">${RN[r]}</span><div class="bar"><i style="width:${n/mx*100}%;background:var(--c2)"></i></div><b>${n}</b></div>`}).join("");
$("r").innerHTML='<option value="">All regions</option>'+R.map(r=>`<option value="${r}">${RN[r]}</option>`).join("")+'<option value="ALL">All India</option>';
$("t").innerHTML='<option value="">All types</option>'+Object.keys(T).map(t=>`<option value="${t}">${T[t][0]}</option>`).join("");
function pick(r){$("r").value=r;draw();$("q").scrollIntoView({behavior:"smooth",block:"center"})}
function draw(){const q=$("q").value.toLowerCase(),r=$("r").value,t=$("t").value;
const rows=D.filter(d=>d[0].toLowerCase().includes(q)&&(!r||d[3]==r)&&(!t||d[1]==t));
$("tb").innerHTML=rows.map(d=>`<tr><td>${d[0].replace("&","&amp;")}</td><td><span class="tag" style="color:${cv(T[d[1]][1])}">${T[d[1]][0]}</span></td><td>${d[2]}</td><td>${[d[4]?"standalone":"",d[5]?"others":""].filter(Boolean).join(", ")||"—"}</td></tr>`).join("");
$("ct").textContent=rows.length+" of "+D.length+" entities"}
["q","r","t"].forEach(i=>$(i).addEventListener("input",draw));draw();
</script></body></html>
